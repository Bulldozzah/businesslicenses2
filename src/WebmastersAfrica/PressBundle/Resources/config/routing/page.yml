managepages:
    pattern:  /
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:index" }

managepages_show:
    pattern:  /{id}/show
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:show" }

managepages_new:
    pattern:  /new
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:new" }

managepages_create:
    pattern:  /create
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:create" }
    requirements: { _method: post }

managepages_edit:
    pattern:  /{id}/edit
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:edit" }

managepages_update:
    pattern:  /{id}/update
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:update" }
    requirements: { _method: post|put }

managepages_delete:
    pattern:  /{id}/delete
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:delete" }

managepages_restore:
    pattern:  /{id}/restore
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:restore" }

managepages_deleted:
    pattern:  /deleted
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:indexdeleted" }

managepages_unpublished:
    pattern:  /unpublished
    defaults: { _controller: "WebmastersAfricaPressBundle:Page:indexUnpublished" }

managepages_adjust_orderLevel:
  pattern: update/position
  defaults: { _controller: "WebmastersAfricaPressBundle:Page:updatePageOrder" }
  requirements: { _method: post }


# NC Pages
managencpages:
    pattern:  /nc/
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:index" }

managencpages_show:
    pattern:  /nc/{id}/show
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:show" }

managencpages_new:
    pattern:  /nc/new
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:new" }

managencpages_create:
    pattern:  /nc/create
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:create" }
    requirements: { _method: post }

managencpages_edit:
    pattern:  /nc/{id}/edit
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:edit" }

managencpages_update:
    pattern:  /nc/{id}/update
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:update" }
    requirements: { _method: post|put }

managencpages_delete:
    pattern:  /nc/{id}/delete
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:delete" }

managencpages_restore:
    pattern:  /nc/{id}/restore
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:restore" }

managencpages_deleted:
    pattern:  /nc/deleted
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:indexdeleted" }

managencpages_unpublished:
    pattern:  /nc/unpublished
    defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:indexUnpublished" }

managencpages_adjust_orderLevel:
  pattern: /nc/update/position
  defaults: { _controller: "WebmastersAfricaPressBundle:NcPage:updatePageOrder" }
  requirements: { _method: post }
