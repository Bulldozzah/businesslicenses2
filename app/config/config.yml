imports:
    - { resource: parameters.yml, ignore_errors: true }
    - { resource: parameters.php }
    - { resource: security.yml }
    - { resource: services.yml }

parameters:
    banners_directory: "%kernel.root_dir%/../web/uploads"
    documents_directory: "%kernel.root_dir%/../web/uploads/documents"

framework:
    #esi:             ~
    translator: { fallback: %locale% }
    secret: %secret%
    router:
        resource: "%kernel.root_dir%/config/routing.yml"
        strict_requirements: ~
    form: ~
    csrf_protection: ~
    validation: { enable_annotations: true }
    templating:
        engines: ["twig"]
        #assets_version: SomeVersionScheme
    default_locale: "%locale%"
    trusted_proxies: ~
    # session: ~
    session:
        storage_id: session.storage.repo
        cookie_lifetime: 3600
        # gc_maxlifetime: 450
        # auto_start:     true
    fragments: ~
    http_method_override: true

# Twig Configuration
twig:
    globals:
        site_title: %site_title%
        fos_csrf_provider: "@form.csrf_provider"
        report_api_url: %app_report_url%
        recaptacha_client_site: %recaptacha_client_site%
    debug: %kernel.debug%
    strict_variables: %kernel.debug%
    cache: false
    form:
        resources:
            - "WebmastersAfricaAdminBundle:Form:fields.html.twig"
            - "WebmastersAfricaAdminBundle:Form:email_widget.html.twig"

# Assetic Configuration
assetic:
    debug: %kernel.debug%
    use_controller: false
    bundles: []
    #java: /usr/bin/java
    filters:
        cssrewrite: ~
        #closure:
        #    jar: %kernel.root_dir%/Resources/java/compiler.jar
        #yui_css:
        #    jar: %kernel.root_dir%/Resources/java/yuicompressor-2.4.7.jar

# Doctrine Configuration
doctrine:
    dbal:
        driver: %database_driver%
        host: %database_host%
        port: %database_port%
        dbname: %database_name%
        user: %database_user%
        password: %database_password%
        charset: UTF8
        options:
            1002: "SET SESSION sql_mode = '%database_sql_mode%'" # PDO::MYSQL_ATTR_INIT_COMMAND
        # if using pdo_sqlite as your database driver, add the path in parameters.yml
        # e.g. database_path: %kernel.root_dir%/data/data.db3
        # path:     %database_path%

    orm:
        auto_generate_proxy_classes: %kernel.debug%
        entity_managers:
            default:
                mappings:
                    WebmastersAfricaAdminBundle: ~
                    WebmastersAfricaUserBundle: ~
                    WebmastersAfricaPressBundle: ~
                    WebmastersAfricaLicenseBundle: ~
                    WebmastersAfricaMessageBundle: ~
                    WebmastersAfricaTaskBundle: ~
                    NoticeCommentBundle: ~
                    gedmo_translatable:
                        type: annotation
                        prefix: Gedmo\Translatable\Entity
                        dir: "%kernel.root_dir%/../vendor/gedmo/doctrine-extensions/lib/Gedmo/Translatable/Entity"
                        alias: GedmoTranslatable # this one is optional and will default to the name set for the mapping
                        is_bundle: false
                    gedmo_translator:
                        type: annotation
                        prefix: Gedmo\Translator\Entity
                        dir: "%kernel.root_dir%/../vendor/gedmo/doctrine-extensions/lib/Gedmo/Translator/Entity"
                        alias: GedmoTranslator # this one is optional and will default to the name set for the mapping
                        is_bundle: false
                    gedmo_loggable:
                        type: annotation
                        prefix: Gedmo\Loggable\Entity
                        dir: "%kernel.root_dir%/../vendor/gedmo/doctrine-extensions/lib/Gedmo/Loggable/Entity"
                        alias: GedmoLoggable # this one is optional and will default to the name set for the mapping
                        is_bundle: false

monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
        nested:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: error

# Swiftmailer Configuration
swiftmailer:
    transport: %mailer_transport%
    encryption: %mailer_encryption%
    port: %mailer_port%
    host: %mailer_host%
    username: %mailer_user%
    password: %mailer_password%
    auth_mode: login
    spool: { type: memory }
    logging: true

#FOS User Bundle
fos_user:
    db_driver: orm
    firewall_name: main
    user_class: WebmastersAfrica\UserBundle\Entity\User
    registration:
        confirmation:
            from_email: # Use this node only if you don't want the global email address for the confirmation email
                address: danmutwiri@students.uonbi.ac.ke
                sender_name: BRRA
            enabled: true # change to true for required email confirmation
            template: FOSUserBundle:Registration:email.txt.twig
    resetting:
        token_ttl: 86400
        email:
            from_email: # Use this node only if you don't want the global email address for the resetting email
                address: inquiries@businesslicences.go.ug
                sender_name: BRRA
            template: FOSUserBundle:Resetting:email.txt.twig
    group:
        group_class: WebmastersAfrica\UserBundle\Entity\Group # Required when using groups
        group_manager: fos_user.group_manager.default
    service:
        mailer: fos_user.mailer.twig_swift
        email_canonicalizer: fos_user.util.canonicalizer.default
        username_canonicalizer: fos_user.util.canonicalizer.default
        token_generator: fos_user.util.token_generator.default
        user_manager: fos_user.user_manager.default

jms_security_extra:
    # Whether you want to secure all services (true), or only secure specific
    # services (false); see also below
    secure_all_services: true

    # Enabling this setting will add an additional special attribute "ROLE_IDDQD".
    # Anybody with this attribute will effectively bypass all security checks.
    enable_iddqd_attribute: true

    # Enables expression language
    expressions: true

    # Allows you to disable some, or all built-in voters
    voters:
        disable_authenticated: false
        disable_role: false
        disable_acl: false

    # Allows you to specify access control rules for specific methods, such
    # as controller actions
    method_access_control: {}

knp_paginator:
    page_range: 3 # default page range used in pagination control
    default_options:
        page_name: page # page query parameter name
        sort_field_name: sort # sort field query parameter name
        sort_direction_name: direction # sort direction query parameter name
        distinct: true # ensure distinct results, useful when ORM queries are using GROUP BY statements
    template:
        pagination: @KnpPaginator/Pagination/sliding.html.twig # sliding pagination controls template
        sortable: KnpPaginatorBundle:Pagination:sortable_link.html.twig # sort link template

knp_menu:
    twig: # use "twig: false" to disable the Twig extension and the TwigRenderer
        template: knp_menu.html.twig
    templating: false # if true, enables the helper for PHP templates
    default_renderer: twig # The renderer to use, list is also available by default

fos_message:
    db_driver: orm
    thread_class: WebmastersAfrica\MessageBundle\Entity\Thread
    message_class: WebmastersAfrica\MessageBundle\Entity\Message

stof_doctrine_extensions:
    default_locale: "%locale%"
    translation_fallback: true
    persist_default_translation: true
    orm:
        default:
            loggable: true
            translatable: true

services:
    twig.extension.text:
        class: Twig_Extensions_Extension_Text
        tags:
            - { name: twig.extension }

    twig.extension.date:
        class: Twig_Extensions_Extension_Date
        tags:
            - { name: twig.extension }

genemu_form:
    captcha: ~

vich_uploader:
    db_driver: orm
    mappings:
        main_document:
            uri_prefix: /uploads/documents
            upload_destination: '%kernel.root_dir%/../web/uploads/documents'
            inject_on_load: true
            delete_on_update: true
            delete_on_remove: true

hwi_oauth:
    #this is my custom user provider, created from FOSUBUserProvider - will manage the
    #automatic user registration on your site, with data from the provider (facebook. google, etc.)
    #and also, the connecting part (get the token and the user_id)
    connect:
        account_connector: my_user_provider
    # name of the firewall in which this bundle is active, this setting MUST be set
    firewall_name: main
    fosub:
        username_iterations: 30
        properties:
            # these properties will be used/redefined later in the custom FOSUBUserProvider service.
            facebook: facebook_id
            google: google_id
    resource_owners:
        facebook:
            type: facebook
            client_id: "%facebook_client_id%"
            client_secret: "%facebook_client_secret%"
            scope: "email"
            infos_url: "https://graph.facebook.com/me?fields=id,first_name,last_name,email"

        google:
            type: google
            client_id: "%google_client_id%"
            client_secret: "%google_client_secret%"
            scope: "https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile"
